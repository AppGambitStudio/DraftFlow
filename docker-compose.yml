version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - PORT=5002

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5002/api

volumes:
  backend_data:
  backend_uploads:
